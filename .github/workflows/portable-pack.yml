name: Portable pack delivery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-pack:
    name: Offline pack readers (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_delivery_pack.py -v
      - run: python -m pip install playwright
      - name: Install Chromium with its Linux system libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Build and extract a portable fixture
        run: python -c "import sys,zipfile; from pathlib import Path; sys.path.insert(0,'tests'); from test_delivery_pack import make_pack; p=Path('sample.zip'); make_pack(p); zipfile.ZipFile(p).extractall('Portable sample')"
      - name: Click through extracted pages in Chromium
        run: python tools/smoke_pack_browser.py "Portable sample/Start here.html"
      - name: Install brochure rendering dependencies
        run: python -m pip install Pillow -r requirements/packs.txt
      - name: Match a clean Windows house issue to the downloadable reference
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_trade_schedules.py -k test_clean_builds_match_all_four_archives
      - name: Reconcile three room purchases with the combined house issue
        run: python examples/multi-room-shopping/replay.py "${{ runner.temp }}/Maple purchasing"
      - name: Rebuild both brochures and exercise walkthrough links
        run: python tests/browser/comparison_pack.py
      - name: Rebuild single components and assemble a house issue
        run: python -m unittest discover -s tests -p test_component_packs.py -v
      - name: Open the extracted component editions at phone and desktop widths
        run: python tests/browser/component_pack.py
      - name: Open all three audience editions alone and inside the house issue on Windows
        if: runner.os == 'Windows'
        run: python tests/browser/audience_packs.py
      - name: Install the independent PowerPoint reader
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-calc fonts-liberation
      - name: Open the audience editions and render the editable slides on Linux
        if: runner.os == 'Linux'
        run: python tests/browser/audience_packs.py --office soffice
      - name: Open the three trade schedules alone and in the complete house on Windows
        if: runner.os == 'Windows'
        run: python tests/browser/trade_schedules.py
      - name: Open the trade schedules and recalculate edited workbooks on Linux
        if: runner.os == 'Linux'
        run: python tests/browser/trade_schedules.py --office soffice
