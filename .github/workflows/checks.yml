name: Repository checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: House workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-routes.txt
      - run: python -m unittest discover -s tests -v

  privacy:
    name: Private files and Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for private files staged despite ignore rules
        shell: bash
        run: |
          git ls-files -ci --exclude-from=.gitignore -z > "$RUNNER_TEMP/private-paths"
          if test -s "$RUNNER_TEMP/private-paths"; then
            echo 'A file covered by the repository privacy rules is tracked.'
            exit 1
          fi
          if test -n "$(git log --all HEAD --full-history -1 --format=%H -- houses/ source/ models/ views/ handover/ backups/ private-backups/ 'House Renovation Backups/')"; then
            echo 'Git history contains a private project directory.'
            exit 1
          fi
      - name: Scan Git history and the checked-out files for secrets
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts='--all HEAD --full-history -m' --redact --no-banner
          ./gitleaks dir "$GITHUB_WORKSPACE" --max-archive-depth=3 --redact --no-banner
