name: Repository checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: House workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/dev.txt
      - name: Install the locked workflow diagram renderer
        working-directory: docs/graphviz
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild and compare the published workflow diagrams
        run: python docs/render_workflow.py --check
      - name: Require diagram updates alongside workflow changes
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_workflow_changes.py "$DIFF_BASE"
      - run: python tools/check_docs.py
      - run: python -m unittest discover -s tests -v

  privacy:
    name: Private files and Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed assets and private paths across Git history
        run: python3 tools/check_public_tree.py --history
      - name: Scan Git history and the checked-out files for secrets
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts='--no-textconv --all HEAD --full-history -m' --redact --no-banner
          ./gitleaks dir "$GITHUB_WORKSPACE" --max-archive-depth=3 --redact --no-banner

  room-assets:
    name: Blender room assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Blender release
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive=blender-5.3.0-linux-x64.tar.xz
          curl --fail --silent --show-error --location --retry 3 \
            "https://download.blender.org/release/Blender5.3/$archive" -o "$archive"
          echo "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05  $archive" | sha256sum --check --status
          tar -xJf "$archive"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libsm6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1
          echo "BLENDER=$RUNNER_TEMP/blender-5.3.0-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Build every catalogue asset and read its size back
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER" --version
          python3 -m unittest discover -s tests -p test_room_assets.py -v 2>&1 | tee "$RUNNER_TEMP/room-assets.log"
          if grep -q "skipped" "$RUNNER_TEMP/room-assets.log"; then
            echo "The geometry tests were skipped: Blender did not run" >&2
            exit 1
          fi

  dependencies:
    name: Dependency audit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - suite: toolkit
            python: '3.12'
            requirements: requirements/dev.txt
          - suite: solver
            python: '3.11'
            requirements: examples/structural-opening/requirements.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve the example environment and audit its dependencies
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m venv "$RUNNER_TEMP/subject"
          "$RUNNER_TEMP/subject/bin/python" -m pip install -r "$REQUIREMENTS"
          "$RUNNER_TEMP/subject/bin/python" -m pip freeze > "$RUNNER_TEMP/resolved.txt"
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --no-deps --disable-pip -r "$RUNNER_TEMP/resolved.txt"
